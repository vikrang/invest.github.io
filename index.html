<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1917;--sf:#16251f;--ink:#e4efec;--mut:#8fa9a3;--ln:#27403a;--ac:#2dd4bf;--eq:#2dd4bf;--db:#8da2fb;--wn:#f5b942;--wnb:#3a2f10;--bad:#fb923c;--good:#4ade80}}
:root[data-theme="dark"]{--bg:#0e1917;--sf:#16251f;--ink:#e4efec;--mut:#8fa9a3;--ln:#27403a;--ac:#2dd4bf;--eq:#2dd4bf;--db:#8da2fb;--wn:#f5b942;--wnb:#3a2f10;--bad:#fb923c;--good:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--ln);background:var(--sf)}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 10px;font-weight:800}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}

button,select,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}

.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.tag.Equity{color:var(--eq)}.tag.Debt{color:var(--db)}.tag.soon{color:var(--wn)}

.seg{cursor:pointer}.seg:hover{opacity:.8}
a.x{color:var(--bad);cursor:pointer;margin-left:8px}a.e{color:var(--ac);cursor:pointer}
.menu{position:absolute;right:20px;top:60px;z-index:20;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px;min-width:260px;box-shadow:0 8px 24px #0003}.menu h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:8px 8px 4px}.menu a{display:block;padding:7px 10px;border-radius:8px;cursor:pointer}.menu a:hover{background:var(--bg)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--mut)}.crumbs a{color:var(--ac);cursor:pointer;font-weight:600}.segc{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.segc button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--mut);font-weight:600}.segc button.on{background:var(--ink);color:var(--bg)}header{position:relative}tr[data-open]:hover{background:var(--bg)}svg text{pointer-events:none}
</style></head><body>

<div class="row" style="margin:0"><span id="role" class="tag soon" hidden></span><label class="mut">Investor <select id="who"></select></label>

<main><nav id="nav"></nav><div id="view"></div></main>
<dialog id="dlg"><form method="dialog" id="frm" class="f"></form></dialog>
<script>
const TYPES={ "Equity shares":"Equity","Equity mutual fund":"Equity","ETF":"Equity","NPS (equity)":"Equity","ULIP":"Equity",
"Fixed deposit":"Debt","Recurring deposit":"Debt","PPF":"Debt","EPF":"Debt","NSC":"Debt","Sukanya Samriddhi":"Debt","Debt mutual fund":"Debt","Bonds / NCD":"Debt","Sovereign Gold Bond":"Debt","Post Office scheme":"Debt","Senior Citizens Savings":"Debt"};
const DAY=864e5,$=s=>document.querySelector(s);
let S={profiles:[],cur:null,inv:{},inc:{},win:15,tab:"Dashboard",eall:false,esort:["pl",-1],fy:null,imode:"all",det:null,f:{q:"",cls:"",type:""},sort:["maturity",1]};
let RW=true;const save=()=>{window.onSave&&onSave()};
const uid=()=>Math.random().toString(36).slice(2,9);
const d0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addD=n=>iso(new Date(d0().getTime()+n*DAY));
const inr=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(n||0);
const short=n=>{const a=Math.abs(n);return (n<0?"-":"")+"₹"+(a>=1e7?(a/1e7).toFixed(2)+" Cr":a>=1e5?(a/1e5).toFixed(2)+" L":a>=1e3?(a/1e3).toFixed(1)+" K":a.toFixed(0))};
const fd=s=>s?new Date(s+"T00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"–";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list=()=>S.inv[S.cur]||(S.inv[S.cur]=[]);
function valAt(i,T){const st=Date.parse(i.start+"T00:00");if(!i.rate)return +i.amount;const end=i.maturity?Math.min(T,Date.parse(i.maturity+"T00:00")):T,y=Math.max(0,(end-st)/DAY/365),r=i.rate/100,n={M:12,Q:4,H:2,Y:1}[i.comp||"Y"];
 if(i.type=="Recurring deposit"&&+i.inst>0){const sd=new Date(st);let t=0;for(let k=0;k<600;k++){const dd=new Date(sd.getFullYear(),sd.getMonth()+k,sd.getDate()).getTime();if(dd>end)break;t+=i.inst*Math.pow(1+r/4,4*(end-dd)/DAY/365)}return t}
 return i.comp=="S"?i.amount*(1+r*y):i.amount*Math.pow(1+r/n,n*y)}
function curVal(i){if(i.value!==""&&i.value!=null&&!isNaN(i.value))return +i.value;return i.rate&&i.start?valAt(i,d0().getTime()):+i.amount}
const daysLeft=i=>i.maturity?Math.round((new Date(i.maturity+"T00:00")-d0())/DAY):null;
function xirr(f){if(f.length<2||!f.some(x=>x.a<0)||!f.some(x=>x.a>0))return null;const t0=Math.min(...f.map(x=>x.t));
 const v=r=>f.reduce((q,x)=>q+x.a/Math.pow(1+r,(x.t-t0)/(365*DAY)),0);let lo=-.99,hi=10;if(v(lo)*v(hi)>0)return null;
 for(let n=0;n<100;n++){const m=(lo+hi)/2;v(lo)*v(m)<=0?hi=m:lo=m}return (lo+hi)/2*100}
function flows(i){const T=d0().getTime(),tx=(i.tx||[]).filter(x=>Date.parse(x.date+"T00:00")<=T);
 const f=tx.length?tx.map(x=>({t:Date.parse(x.date+"T00:00"),a:x.type=="sell"?+x.amount:-x.amount})):[{t:Date.parse(i.start+"T00:00"),a:-i.amount}];
 f.push({t:T,a:curVal(i)});return f}
function cagr(i){const f=flows(i);return (d0().getTime()-Math.min(...f.map(x=>x.t)))/DAY>30?xirr(f):null}
function txForm(i){i.tx=i.tx||[];const dlg=$("#dlg"),F=$("#frm");F.onsubmit=null;
 const sync=()=>{if(i.tx.length){const b=i.tx.filter(x=>x.type!="sell").reduce((q,x)=>q+ +x.amount,0),c=i.tx.filter(x=>x.type=="sell").reduce((q,x)=>q+ +x.amount,0);i.amount=Math.max(0,b-c);i.start=i.tx.map(x=>x.date).sort()[0]}render()};
 const draw=()=>{F.innerHTML=`<h2 class="w">Transactions: ${esc(i.name)}</h2><div class="w wrap" style="max-height:190px;overflow:auto"><table>${i.tx.slice().sort((a,b)=>a.date<b.date?-1:1).map(x=>`<tr><td>${fd(x.date)}</td><td>${x.type=="sell"?"Redeem":"Invest"}</td><td>${inr(x.amount)}</td><td><a class="x" data-rm="${x.id}">Remove</a></td></tr>`).join("")||`<tr><td class="mut">No transactions yet. Without them, XIRR assumes one lump sum on the start date.</td></tr>`}</table></div>
 <label>Type<select id="t_ty"><option value="buy">Invest</option><option value="sell">Redeem</option></select></label><label>Date<input id="t_d" type="date" value="${iso(d0())}"></label>
 <label>Amount (₹)<input id="t_a" type="number" min="0" step="any"></label><div class="row" style="align-items:end"><button type="button" class="btn" id="t_add">Add transaction</button></div>
 <h2 class="w">Monthly SIP</h2><label>Amount per month (₹)<input id="s_a" type="number" min="0" step="any"></label><label>First instalment<input id="s_d" type="date" value="${iso(d0())}"></label>
 <label>Months<input id="s_n" type="number" min="1" max="360" value="12"></label><div class="row" style="align-items:end"><button type="button" class="btn ghost" id="s_add">Generate SIP</button></div>
 <p class="w mut">Future instalments are ignored in XIRR until their date arrives.</p><div class="w row" style="justify-content:flex-end"><button class="btn" value="x">Done</button></div>`;
 F.querySelectorAll("[data-rm]").forEach(a=>a.onclick=()=>{i.tx=i.tx.filter(x=>x.id!=a.dataset.rm);sync();draw()});
 $("#t_add").onclick=()=>{const a=+$("#t_a").value,d=$("#t_d").value;if(!(a>0)||!d)return;i.tx.push({id:uid(),type:$("#t_ty").value,date:d,amount:a});sync();draw()};
 $("#s_add").onclick=()=>{const a=+$("#s_a").value,d=$("#s_d").value,n=Math.min(360,+$("#s_n").value||0);if(!(a>0)||!d||!n)return;const[y,m,dd]=d.split("-").map(Number);
  for(let k=0;k<n;k++){const dt=new Date(y,m-1+k,1);dt.setDate(Math.min(dd,new Date(y,m+k,0).getDate()));i.tx.push({id:uid(),type:"buy",date:iso(dt),amount:a})}sync();draw()}};
 draw();dlg.showModal()}
function casPick(){const f=document.createElement("input");f.type="file";f.accept=".json,application/json";
 f.onchange=async()=>{try{const n=importCas(JSON.parse(await f.files[0].text()));render();alert(n?n+" holdings imported or updated.":"No holdings found in this file.")}catch(e){alert("This file couldn’t be read as a CAS JSON export: "+e.message)}};f.click()}
function importCas(d){const a=list();let n=0;const up=o=>{const k=a.findIndex(x=>x.id==o.id);if(k>=0){if(!o.tx||!o.tx.length){delete o.amount;delete o.start}Object.assign(a[k],o)}else a.push(o);n++};
 for(const fo of d.folios||[])for(const sc of fo.schemes||[]){
  const tx=(sc.transactions||[]).filter(t=>t.amount!=null&&t.date).map(t=>({id:uid(),type:/^(REDEMPTION|SWITCH_OUT)/.test(t.type)?"sell":/^(PURCHASE|SWITCH_IN)/.test(t.type)?"buy":null,date:String(t.date).slice(0,10),amount:Math.abs(+t.amount)})).filter(t=>t.type&&t.amount>0);
  const val=+(sc.valuation&&sc.valuation.value)||0,units=+sc.close||+sc.close_calculated||0;if(!val&&!units)continue;
  const net=tx.reduce((q,t)=>q+(t.type=="sell"?-t.amount:t.amount),0);
  up({id:"cas-"+(sc.isin||sc.rta_code||sc.scheme)+"-"+fo.folio,name:sc.scheme,type:/DEBT|LIQUID|GILT/i.test(sc.type||"")?"Debt mutual fund":"Equity mutual fund",tx,amount:tx.length?Math.max(0,net):(+(sc.valuation&&sc.valuation.cost)||val),
   start:tx.length?tx.map(t=>t.date).sort()[0]:iso(d0()),value:val,qty:units,isin:sc.isin||"",amfi:sc.amfi?String(sc.amfi):"",note:"Folio "+fo.folio+" · "+(fo.amc||""),rate:0,maturity:""})}
 for(const ac of d.accounts||[]){for(const e of ac.equities||[])up({id:"cas-"+e.isin,name:e.name,type:"Equity shares",isin:e.isin,qty:+e.num_shares||0,value:+e.value||0,amount:+e.value||0,start:iso(d0()),rate:0,maturity:"",note:"Demat "+(ac.type||"")});
  for(const e of ac.mutual_funds||[])up({id:"cas-"+e.isin,name:e.name,type:"Equity mutual fund",isin:e.isin,qty:+(e.balance||e.units)||0,value:+e.value||0,amount:+e.value||0,start:iso(d0()),rate:0,maturity:"",note:"Demat "+(ac.type||"")})}
 return n}
const cp=()=>S.profiles.find(p=>p.id==S.cur)||{},incList=()=>S.cur?(S.inc[S.cur]||(S.inc[S.cur]=[])):[];
const fyNow=()=>{const d=new Date();return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1},fyOf=x=>{const d=new Date(x+"T00:00");return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1},fyL=y=>y+"-"+String(y+1).slice(2);
const dl=(n,t)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=n;a.click()};
const BANKS={HDFC:"HDFC Bank",SBIN:"State Bank of India",ICIC:"ICICI Bank",UTIB:"Axis Bank",KKBK:"Kotak Mahindra Bank",PUNB:"Punjab National Bank",BARB:"Bank of Baroda",CNRB:"Canara Bank",UBIN:"Union Bank of India",IDIB:"Indian Bank",INDB:"IndusInd Bank",YESB:"Yes Bank",IBKL:"IDBI Bank",FDRL:"Federal Bank",IOBA:"Indian Overseas Bank",BKID:"Bank of India",CBIN:"Central Bank of India",MAHB:"Bank of Maharashtra",UCBA:"UCO Bank",SIBL:"South Indian Bank",KVBL:"Karur Vysya Bank",RATN:"RBL Bank",IDFB:"IDFC First Bank",AUBL:"AU Small Finance Bank",POST:"India Post Payments Bank"};
function profForm(p){const F=$("#frm");p.banks=p.banks||[];p.demats=p.demats||[];const keep=()=>{const n=$("#p_n").value.trim();if(n)p.name=n;p.pan=$("#p_p").value.trim().toUpperCase()};
 F.onsubmit=e=>{if(e.submitter.value=="ok"){keep();render()}};
 const draw=()=>{F.innerHTML=`<h2 class="w">Investor details</h2><label>Name<input id="p_n" value="${esc(p.name)}"></label><label>PAN<input id="p_p" maxlength="10" value="${esc(p.pan)}"></label>
 <h2 class="w">Bank accounts</h2>${p.banks.map(b=>`<div class="w mut">${esc(b.bank)}${b.branch?", "+esc(b.branch):""} · ${esc(b.type)} · ••••${esc(b.acc)} · ${esc(b.ifsc)}${b.addr?"<br>"+esc(b.addr):""} <a class="x" data-rb="${b.id}">Remove</a></div>`).join("")||'<div class="w mut">None added yet.</div>'}
 <label>IFSC (bank and address fill in)<input id="b_i" maxlength="11" autocomplete="off"></label><label>Account number (last 4 digits)<input id="b_a" maxlength="4" inputmode="numeric"></label>
 <label>Bank<input id="b_b"></label><label>Branch<input id="b_r"></label><label class="w">Branch address<input id="b_ad"></label><label>Account type<select id="b_t"><option>Savings</option><option>Current</option><option>NRE</option><option>NRO</option></select></label><div class="mut" id="b_s" style="align-self:end"></div>
 <div class="w row"><button type="button" class="btn ghost" id="b_add">Add bank account</button></div>
 <h2 class="w">Trading and demat accounts</h2>${p.demats.map(d=>`<div class="w mut">${esc(d.broker)} · client ${esc(d.client)} · demat ${esc(d.demat)} <a class="x" data-rd="${d.id}">Remove</a></div>`).join("")||'<div class="w mut">None added yet.</div>'}
 <label>Broker<input id="d_b" list="brk"></label><datalist id="brk">${["Zerodha","Groww","Upstox","ICICI Direct","HDFC Securities","Kotak Securities","Angel One","Axis Direct","Sharekhan","Motilal Oswal","5paisa","Paytm Money"].map(x=>`<option>${x}</option>`).join("")}</datalist><label>Trading client ID<input id="d_c"></label><label class="w">Demat (DP ID and client ID)<input id="d_d" placeholder="IN301234 12345678"></label>
 <div class="w row"><button type="button" class="btn ghost" id="d_add">Add trading account</button></div><div class="w row" style="justify-content:flex-end"><button class="btn ghost" value="x" formnovalidate>Cancel</button><button class="btn" value="ok">Save details</button></div>`;
 F.querySelectorAll("[data-rb]").forEach(a=>a.onclick=()=>{keep();p.banks=p.banks.filter(x=>x.id!=a.dataset.rb);draw()});F.querySelectorAll("[data-rd]").forEach(a=>a.onclick=()=>{keep();p.demats=p.demats.filter(x=>x.id!=a.dataset.rd);draw()});
 $("#b_i").oninput=async e=>{const c=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"");e.target.value=c;const S2=$("#b_s");if(c.length>=4&&BANKS[c.slice(0,4)]&&!$("#b_b").value)$("#b_b").value=BANKS[c.slice(0,4)];if(c.length!=11)return;S2.textContent="Looking up…";
  try{const r=await fetch("https://ifsc.razorpay.com/"+c);if(!r.ok)throw 0;const j=await r.json();$("#b_b").value=j.BANK||"";$("#b_r").value=j.BRANCH||"";$("#b_ad").value=j.ADDRESS||"";S2.textContent="Filled from IFSC"}catch(x){S2.textContent="Couldn’t look this up. Check the IFSC or enter the details by hand."}};
 $("#b_add").onclick=()=>{keep();const b=$("#b_b").value.trim();if(!b)return;p.banks.push({id:uid(),bank:b,branch:$("#b_r").value.trim(),addr:$("#b_ad").value.trim(),type:$("#b_t").value,acc:$("#b_a").value.replace(/\D/g,"").slice(-4),ifsc:$("#b_i").value.trim().toUpperCase()});draw()};
 $("#d_add").onclick=()=>{keep();const b=$("#d_b").value.trim();if(!b)return;p.demats.push({id:uid(),broker:b,client:$("#d_c").value.trim(),demat:$("#d_d").value.trim()});draw()}};
 draw();$("#dlg").showModal()}
function eqv(){const ps=S.eall?S.profiles:S.profiles.filter(p=>p.id==S.cur);
 const rows=ps.flatMap(p=>(S.inv[p.id]||[]).filter(i=>TYPES[i.type]=="Equity").map(i=>{const v=curVal(i),q=+i.qty||0,d=Math.round((d0()-new Date(i.start+"T00:00"))/DAY),inv=+i.amount;return{i,p,v,q,inv,pl:v-inv,pc:inv?(v-inv)/inv*100:0,avg:q?inv/q:null,ltp:q?v/q:null,d,lt:d>=365}}));
 const k=S.esort[0],dir=S.esort[1];rows.sort((a,b)=>{const g=r=>k=="name"?r.i.name.toLowerCase():k=="d"?r.d:r[k];return(g(a)>g(b)?1:-1)*dir});
 const T=rows.reduce((t,r)=>{t.inv+=r.inv;t.v+=r.v;r.lt?t.lt+=r.pl:t.st+=r.pl;r.pl>=0?(t.g+=r.pl,t.n++):(t.l+=r.pl,t.m++);return t},{inv:0,v:0,lt:0,st:0,g:0,l:0,n:0,m:0});
 const pl=T.v-T.inv,mx=Math.max(1,...rows.map(r=>Math.abs(r.pl))),c=n=>n>=0?"up":"dn",h=(x,l)=>`<th data-es="${x}">${l}${k==x?(dir>0?" ▲":" ▼"):""}</th>`,f2=n=>n==null?"–":n.toLocaleString("en-IN",{maximumFractionDigits:2});
 const kp=(l,v,cl,sub)=>`<div class="card"><div class="mut">${l}</div><div class="big ${cl||""}">${v}</div>${sub?`<div class="mut">${sub}</div>`:""}</div>`;
 const pd=rows.map(r=>r.i.pxDate).filter(Boolean).sort().pop();
 return `<div class="row"><span class="mut">${pd?"Prices as of previous close, "+fd(pd):"Prices are entered by hand"}. Update them from Tools › Prices.</span><button class="btn ghost" id="eall">${S.eall?"Showing all investors. Show current only":"Showing "+esc(cp().name||"")+". Show all investors"}</button></div>

};
const loadRemote=async()=>{
  const snapShot=await dataRef().get();
  if(!snapShot.exists){
    const initial={app:"nivesh",v:1,at:Date.now(),profiles:[{id:"p1",name:"Primary investor",pan:""}],inv:{p1:[]},inc:{},win:15};
    await dataRef().set({...initial,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:user.email||""});
    apply(initial);
  }else{
    const d=parse(snapShot.data());
    if(!d)throw new Error("The shared Firestore document has an unexpected format.");
    apply(d);
  }
  lastJ=jsonOf();loadDone=true;
  render();notifyDue();addCloudStatus();
  showStatus("Cloud connected · shared portfolio · signed in as "+(user.email||"Google user")+" · saved data is shared with all approved users.");
  setAppVisible(true);setGate(false);
  const r=$("#role");if(r){r.hidden=false;r.textContent="Shared cloud data"}
};
const flush=async()=>{
  if(!user||!loadDone||saving)return;
  const j=jsonOf();if(j===lastJ){pend=false;return}
  saving=true;lastJ=j;lastAt=Date.now();const d=snap();pend=false;
  try{
    await dataRef().set({...d,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:user.email||""});
    showStatus("Saved securely to the shared cloud · "+T(lastAt)+" · all approved users see the same data.");
  }catch(e){
    pend=true;
    showStatus("Cloud save failed. Your changes are not confirmed as saved. Check your connection and access rules, then retry. "+(e.message||e),"bad");
    console.error(e);
  }finally{saving=false}
};
window.onSave=()=>{
  if(!loadDone||!user)return;
  if(jsonOf()===lastJ)return;
  pend=true;clearTimeout(timer);timer=setTimeout(flush,500);
};
addEventListener("beforeunload",e=>{if(pend){e.preventDefault();e.returnValue=""}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&pend)flush()});

const histDlg=async()=>{
  const F=$("#frm");F.onsubmit=null;
  F.innerHTML=`<h2 class="w">Cloud history</h2><p class="w mut">Recent shared snapshots saved by Nivesh. Restoring a snapshot replaces the shared portfolio for every approved user.</p><div class="w" id="nivesh-cloud-history">Loading…</div><div class="w row" style="justify-content:flex-end"><button class="btn ghost" value="x">Close</button></div>`;
  $("#dlg").showModal();
  try{
    const q=await historyRef().orderBy("createdAt","desc").limit(12).get();
    const box=$("#nivesh-cloud-history");
    if(!q.size){box.innerHTML='<span class="mut">No history entries yet.</span>';return}
    box.innerHTML=q.docs.map((doc,i)=>{
      const d=doc.data(),dt=d.createdAt&&d.createdAt.toDate?d.createdAt.toDate():new Date(d.at||Date.now());
      const count=Object.values(d.inv||{}).flat().length;
      return `<div class="row" style="justify-content:space-between;margin:0 0 6px"><span>${escHtml(T(dt))} · ${d.profiles?.length||0} investors, ${count} investments</span><a class="e" data-cloud-h="${i}">Restore</a></div>`;
    }).join("");
    box.querySelectorAll("[data-cloud-h]").forEach((a,i)=>a.onclick=async()=>{
      if(!confirm("Restore this snapshot to the shared portfolio for all approved users?"))return;
      const d=q.docs[i].data();if(!valid(d))return alert("This history entry is invalid.");
      await pushHistory(snap());
      const restore={app:"nivesh",v:1,at:Date.now(),profiles:d.profiles,inv:d.inv||{},inc:d.inc||{},win:d.win||15};
      await dataRef().set({...restore,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:user.email||""});
      apply(restore);lastJ=jsonOf();render();$("#dlg").close();
      showStatus("Cloud history restored by "+(user.email||"an approved user")+".");
    });
  }catch(e){$("#nivesh-cloud-history").textContent="Could not load cloud history: "+e.message}
};
const mk=(l,f)=>addTool(l,f);
mk("Back up",()=>{
  const t=JSON.stringify(snap(),null,2),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));
  a.download="nivesh-backup-"+iso(d0())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
mk("Restore",()=>{
  const f=document.createElement("input");f.type="file";f.accept=".json";
  f.onchange=async()=>{
    try{
      const d=parse(await f.files[0].text());if(!d)return alert("This isn’t a Nivesh backup file.");
      if(!confirm("Replace the shared cloud portfolio for all approved users with this backup? A cloud history copy will be kept."))return;
      await pushHistory(snap());apply(d);lastJ="";await flush();render();
    }catch(e){alert("Restore failed: "+e.message)}
  };f.click();
});
mk("History",histDlg);
const originalToolButton=$("#toolbtn");
if(originalToolButton)originalToolButton.title="Back up / restore / shared cloud history";
const r=$("#role");if(r){r.hidden=false;r.textContent="Sign-in required"}
(async()=>{
  try{
    if(!window.NIVESH_FIREBASE_CONFIG||!window.NIVESH_FIREBASE_CONFIG.apiKey||window.NIVESH_FIREBASE_CONFIG.apiKey==="PASTE_API_KEY_HERE"){
      msg("Firebase is not configured yet. Complete the setup steps in README.md, then replace firebase-config.js with your project's web app configuration.");
      return;
    }
    firebase.initializeApp(window.NIVESH_FIREBASE_CONFIG);
    auth=firebase.auth();db=firebase.firestore();
    db.settings({ignoreUndefinedProperties:true});
    auth.onAuthStateChanged(async u=>{
      user=u;
      document.getElementById("nivesh-google-logout").style.display=u?"block":"none";
      if(!u){loadDone=false;setAppVisible(false);setGate(true);msg("Connect securely with an approved Google account to access the shared portfolio.");return}
      setGate(true);setAppVisible(false);msg("Checking access and loading the shared portfolio…");
      try{await loadRemote()}
      catch(e){
        console.error(e);await auth.signOut().catch(()=>{});
        setGate(true);setAppVisible(false);
        msg("Access denied or cloud setup incomplete. Only emails listed in firestore.rules are permitted. Details: "+(e.message||e));
      }
    });
  }catch(e){msg("Firebase initialization error: "+e.message)}
})();
})();</script></body></html>
